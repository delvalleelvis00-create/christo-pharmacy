    <h1>My To-Do List</h1>

    <form class="form-card" id="todo-form">
      <label for="todo-input">New task</label>
      <input type="text" id="todo-input" placeholder="e.g. Restock paracetamol">
      <button type="submit">Add</button>
    </form>
    <p id="todo-message" class="result error hidden"></p>

    <p id="todo-count"></p>
    <button type="button" id="clear-done" class="secondary-button">Clear completed</button>
    <ul id="todo-list"></ul>

    <script src="todo.js"></script>
